[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-cli"
version = "0.29.0"
description = "Multi-model read-only code review + AI panels."
requires-python = ">=3.9"
dependencies = ["pyyaml"]

# The visual-verification test suite generates fixture PNGs with Pillow and shells out
# to ImageMagick (`magick`, a SYSTEM dependency — install separately, e.g. `brew install
# imagemagick`). Pillow is TEST-only, not a runtime dependency (cvGate uses ImageMagick,
# never Pillow). Install with `pip install -e '.[test]'` before running the smoke suite.
# The smoke suite (tests/smoke.py) is Python and runs standalone (`python tests/smoke.py`,
# what CI runs); it is ALSO pytest-collectable (`pytest tests/smoke.py`) when pytest is present.
[project.optional-dependencies]
test = ["pillow", "pytest>=8,<9"]
# The qa Tier-2 LIVE bot driver drives a real test Telegram USER account over MTProto via
# Telethon (reviewlib/qa/live_tier.py::LiveBotDriver). It is an OPT-IN qa-harness dep, NOT a hard
# runtime dep and NOT installed in CI: `review` and the hermetic Tier-1 qa path work without it,
# and the live tier is gated behind test-account creds anyway. Install it only to run a live bot
# tier: `pip install -e '.[live]'`. The driver lazy-imports telethon and BLOCKs with this install
# hint when it is absent, so a missing dep never crashes import.
live = ["telethon>=1.34,<2"]
# `review dashboard` as a MANAGED SERVICE (run/start/status/stop/enable/disable + launchd/
# systemd autostart) is powered by the shared `agenttools_service` lib — ONE service-manager
# every long-running agent-tools server reuses, instead of each tool hand-rolling pidfiles /
# autostart units. It is an IN-ECOSYSTEM dependency (agent-tools/lib/agenttools_service, itself
# stdlib-only + agenttools-daemon), not yet on PyPI, so it CANNOT be listed as a PyPI dep.
# Install editable from the agent-tools checkout before using `review dashboard run/start/…`:
#   pip install -e <agent-tools>/lib/agenttools_daemon -e <agent-tools>/lib/agenttools_service
# The lazy import in reviewlib.cli emits an actionable error (exit 4) if it is missing.
# NOTE: this extra intentionally has no PyPI packages — the dep is an in-ecosystem local install.
dashboard = []
# `review install-commit-hook` delegates to `rig apply` when rig is present (rig's opt-in
# `git_hooks.dispatcher` provisions the SAME global pre-commit review gate this command used to
# install directly — two tools writing `core.hooksPath` is exactly the double-write the shared
# `agenttools_rig_delegate` lib (agent-tools#282, stdlib-only) exists to remove). It is an
# IN-ECOSYSTEM dependency, not on PyPI, so it cannot be listed as a plain dep either. The import
# in reviewlib.install is guarded — with it absent, install-commit-hook behaves exactly as before
# (the direct installer). Install editable from the agent-tools checkout to enable delegation:
#   pip install -e <agent-tools>/lib/agenttools_rig_delegate
rig-delegate = []

# Stage 0 (decomposition) packaging — see docs/architecture-visual-verification.md §8.1, D8.
# The CLI is now a real package (`reviewlib`), so it is exposed via a proper console
# entry point instead of the deprecated distutils `script-files` shebang-rewrite. pipx
# installs `review = reviewlib.cli:main` from the wheel and never touches `bin/review`.
# The legacy install.sh SYMLINK path keeps working unchanged: `bin/review` is a thin shim
# that resolves the symlink to the repo root and imports `reviewlib`.
[project.scripts]
review = "reviewlib.cli:main"

# Explicit package list (NOT setuptools flat-layout autodiscovery, which would silently
# pull stray top-level dirs into the wheel). features/ is a SUBpackage of reviewlib, so
# `reviewlib*` captures reviewlib, reviewlib.modes, reviewlib.features, reviewlib.features.*,
# reviewlib.dashboard.
[tool.setuptools.packages.find]
include = ["reviewlib*"]

# The dashboard ships a vanilla-JS SPA (no npm build); its HTML/JS/CSS assets must land in
# the wheel alongside the package so `review dashboard` can serve them from an installed copy.
# The spec-web frontend (HTML/CSS/JS) is likewise served by the stdlib HTTP server (not
# importable Python), so packages.find alone would drop it — ship it as package data too.
[tool.setuptools.package-data]
"reviewlib.dashboard" = ["assets/*.html", "assets/*.js", "assets/*.css"]
"reviewlib.specweb" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.png"]

# Lint config. The default rule set (pyflakes `F` + a pycodestyle `E`/`W` subset) is kept
# deliberately — it is exactly what surfaced the latent F401/F541/F841/E702 errors this
# config + the CI `lint` job now keep out. `target-version` is pinned to the project's Python
# floor (requires-python = ">=3.9") so that IF a version-gated rule family (e.g. UP, parts of
# B) is adopted later it is judged against the right Python; with TODAY's default set there
# are no version-gated rules, so target-version is latent, not active. The CI job pins the
# ruff VERSION (see .github/workflows/ci.yml) so a new ruff release can't flip a green PR red
# on its own; bump both together when intentionally adopting newer rules.
[tool.ruff]
target-version = "py39"
