[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-cli"
version = "0.2.0"
description = "Multi-model read-only code review + AI panels."
requires-python = ">=3.9"
dependencies = ["pyyaml"]

# The visual-verification test suite generates fixture PNGs with Pillow and shells out
# to ImageMagick (`magick`, a SYSTEM dependency — install separately, e.g. `brew install
# imagemagick`). Pillow is TEST-only, not a runtime dependency (cvGate uses ImageMagick,
# never Pillow). Install with `pip install -e '.[test]'` before running tests/smoke.sh.
[project.optional-dependencies]
test = ["pillow"]

# Stage 0 (decomposition) packaging — see docs/architecture-visual-verification.md §8.1, D8.
# The CLI is now a real package (`reviewlib`), so it is exposed via a proper console
# entry point instead of the deprecated distutils `script-files` shebang-rewrite. pipx
# installs `review = reviewlib.cli:main` from the wheel and never touches `bin/review`.
# The legacy install.sh SYMLINK path keeps working unchanged: `bin/review` is a thin shim
# that resolves the symlink to the repo root and imports `reviewlib`.
[project.scripts]
review = "reviewlib.cli:main"

# Explicit package list (NOT setuptools flat-layout autodiscovery, which would silently
# pull stray top-level dirs into the wheel). features/ is a SUBpackage of reviewlib, so
# `reviewlib*` captures reviewlib, reviewlib.modes, reviewlib.features, reviewlib.features.*,
# reviewlib.dashboard.
[tool.setuptools.packages.find]
include = ["reviewlib*"]

# The dashboard ships a vanilla-JS SPA (no npm build); its HTML/JS/CSS assets must land in
# the wheel alongside the package so `review dashboard` can serve them from an installed copy.
# The spec-web frontend (HTML/CSS/JS) is likewise served by the stdlib HTTP server (not
# importable Python), so packages.find alone would drop it — ship it as package data too.
[tool.setuptools.package-data]
"reviewlib.dashboard" = ["assets/*.html", "assets/*.js", "assets/*.css"]
"reviewlib.specweb" = ["static/*.html", "static/*.css", "static/*.js"]
