name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin the ruff version so a new release can't flip a green PR red on its own (a rule
      # added upstream would otherwise fail unrelated code). Bump deliberately, in lockstep
      # with the [tool.ruff] config note in pyproject.toml, when adopting newer rules.
      - name: Install ruff
        run: pip install 'ruff==0.15.18'
      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # ImageMagick + Pillow gate the visual-verification tests. apt ships
      # ImageMagick 6 (`convert`), while the cvGate needs the v7 `magick` command —
      # so on the stock runner the visual suite self-skips (loudly) and the core
      # suite still runs. Install both anyway so a v7 runner picks them up.
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install package + test deps
        # NOTE: the managed-dashboard subcommands need the shared `agenttools_service` lib
        # (the `[dashboard]` extra). It is an in-ecosystem lib, not yet on PyPI, so it is NOT
        # installed here — the smoke suite exercises the actionable "lib missing" error path
        # (exit 4, no traceback) instead, and the dashboard's data/parser tests don't need it.
        # Once `agenttools-service` is published, add `[dashboard]` here to also exercise the
        # wired lifecycle path in CI.
        run: pip install -e '.[test]'
      - name: Smoke + unit tests
        # The smoke suite is Python (the ecosystem is Python-only): it drives the real
        # `bin/review` CLI via subprocess and runs the standalone tests/test_*.py unit files.
        # Runnable standalone (`python tests/smoke.py`) or under pytest (`pytest tests/smoke.py`).
        run: python tests/smoke.py
