<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="ralphex is one opaque black-box binary that owns the whole autonomous loop: it drives a coding agent to generate code, runs its own built-in review, and commits, repeating until the plan is done.">
  <defs>
    <marker id="rxArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cfcfcf"/>
    </marker>
    <marker id="rxArrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="40" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#e8e8e8">ralphex</text>
  <rect x="40" y="56" width="58" height="4" rx="2" fill="#9a9a9a"/>
  <text x="172" y="44" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#8a8a8a">all-in-one encapsulated loop &#8212; opaque, opinionated</text>

  <!-- the black box -->
  <rect x="40" y="74" width="720" height="190" rx="18" fill="#1d1f24" stroke="#3a3d44" stroke-width="1.5"/>
  <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#d6d6d6">one binary owns the whole loop</text>

  <!-- plan input -->
  <rect x="64" y="150" width="120" height="64" rx="12" fill="#2a2d34" stroke="#52565f" stroke-width="1.5"/>
  <text x="124" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">plan</text>
  <text x="124" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#9a9a9a">you write it</text>

  <!-- code-gen -->
  <rect x="244" y="150" width="148" height="64" rx="12" fill="#2a2d34" stroke="#52565f" stroke-width="1.5"/>
  <text x="318" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">code-gen agent</text>
  <text x="318" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#9a9a9a">writes the code</text>

  <!-- built-in review -->
  <rect x="452" y="150" width="148" height="64" rx="12" fill="#2a2d34" stroke="#52565f" stroke-width="1.5"/>
  <text x="526" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">built-in review</text>
  <text x="526" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#9a9a9a">5 agents + codex</text>

  <!-- commit -->
  <rect x="660" y="150" width="76" height="64" rx="12" fill="#2a2d34" stroke="#52565f" stroke-width="1.5"/>
  <text x="698" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">commit</text>

  <!-- forward arrows -->
  <path d="M184 182 H 240" fill="none" stroke="#cfcfcf" stroke-width="2.25" stroke-linecap="round" marker-end="url(#rxArrow)"/>
  <path d="M392 182 H 448" fill="none" stroke="#cfcfcf" stroke-width="2.25" stroke-linecap="round" marker-end="url(#rxArrow)"/>
  <path d="M600 182 H 656" fill="none" stroke="#cfcfcf" stroke-width="2.25" stroke-linecap="round" marker-end="url(#rxArrow)"/>

  <!-- repeat loop from commit back to code-gen -->
  <path d="M698 214 V 244 H 318 V 214" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 5" marker-end="url(#rxArrowLoop)"/>
  <text x="508" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#8a8a8a">repeat until the plan is done</text>

  <!-- caption under the box -->
  <text x="400" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#8a8a8a">Walk away, come back to reviewed-and-committed code &#8212; code-gen <tspan font-weight="600" fill="#b8b8b8">and</tspan> review fused, the loop is the tool's.</text>
</svg>
