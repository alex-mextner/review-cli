<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spec review — {{SPEC_TITLE}}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-spec-title="{{SPEC_TITLE}}">
<header class="topbar">
  <div class="topbar-title">Spec review · <span id="specTitle">{{SPEC_TITLE}}</span></div>
  <button class="back-btn" id="navBack" hidden title="Back to previous position" aria-label="Back to previous position">← Back</button>
</header>

<div class="layout" id="layout">
  <main class="spec-pane" id="specPane">
    <div class="spec-body" id="specBody">
      <div class="loading">Loading spec…</div>
    </div>
  </main>

  <div class="divider" id="divider" title="Drag to resize" aria-hidden="true"></div>

  <aside class="comments-pane" id="commentsPane">
    <div class="comments-header">
      <button class="comments-collapse" id="commentsCollapse" aria-label="Collapse comments" aria-expanded="true">
        <span class="collapse-caret" aria-hidden="true">▾</span>
        <span class="collapse-label">Comments</span>
        <span class="comments-count" id="commentsCount" hidden>0</span>
      </button>
      <label class="filter-select-label">
        <span class="sr-only">Filter comments</span>
        <select id="filterSelect">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="submitted">Submitted</option>
          <option value="answered">Answered</option>
          <option value="resolved">Resolved</option>
        </select>
      </label>
    </div>
    <div class="pending-tray" id="pendingTray" hidden>
      <span id="pendingLabel">Pending review (0)</span>
      <button id="submitReview" class="primary">Submit review</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comments-empty" id="commentsEmpty">
      Select any text in the spec to ask a question or leave a remark.
    </div>
  </aside>
</div>

<!-- Selection popup: the two kinds are framed distinctly (question expects an answer,
     remark is feedback that does not). The button titles are injected from KINDS at boot
     so the framing text has one source of truth (app.js). -->
<div class="sel-popup" id="selPopup" hidden>
  <button id="selQuestion" class="sel-kind sel-kind-question">
    <span class="kind-icon" aria-hidden="true">❓</span> Ask a question
  </button>
  <button id="selRemark" class="sel-kind sel-kind-remark">
    <span class="kind-icon" aria-hidden="true">💬</span> Leave a remark
  </button>
</div>

<!-- New-comment / question composer -->
<div class="composer-backdrop" id="composerBackdrop" hidden>
  <div class="composer" id="composer" role="dialog" aria-modal="true" aria-labelledby="composerHead">
    <div class="composer-head" id="composerHead">New remark</div>
    <div class="composer-hint" id="composerHint"></div>
    <div class="composer-draft-note" id="composerDraftNote" hidden>Restored your in-progress draft.</div>
    <blockquote class="composer-quote" id="composerQuote"></blockquote>
    <textarea id="composerBody" placeholder="Write a remark or a question…" rows="4"></textarea>
    <div class="composer-actions">
      <button id="composerCancel">Cancel</button>
      <button id="composerSubmit" class="primary">Add to review</button>
    </div>
  </div>
</div>

<!-- The URL prefix for this spec's API/asset calls. "" in single-spec mode; "/spec/<name>"
     under the multi-spec daemon (so the ONE shared origin routes to the right spec). The
     server fills {{BASE}} (already escaped); app.js prepends it to every fetch. -->
<script>window.__SPECWEB_BASE__ = "{{BASE}}";</script>
<script src="/static/app.js"></script>
</body>
</html>
